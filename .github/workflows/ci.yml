name: DocuSense AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docusense_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev build-essential

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyTest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/docusense_ai
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-32bytes-long-ci
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy_test_key_for_mocked_ci' }}
        run: |
          pytest -v

      - name: Run Retrieval Benchmark (Recall@K & Latency)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/docusense_ai
          REDIS_URL: redis://localhost:6379/0
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy_test_key_for_mocked_ci' }}
        run: |
          python scripts/evaluate_retrieval.py

      - name: Build Docker Image
        run: |
          docker build -t docusense-ai-api:latest .
