services:
  # 1. FastAPI Web API Service
  - type: web
    name: docusense-api
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: docusense-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: docusense-redis
          property: connectionString

  # 2. Celery Asynchronous Ingestion Worker
  - type: worker
    name: docusense-celery-worker
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A workers.celery_app.celery_app worker --loglevel=info -c 2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: docusense-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: docusense-redis
          property: connectionString

databases:
  # Managed PostgreSQL 16
  - name: docusense-postgres
    region: oregon
    plan: standard
    postgresMajorVersion: 16

  # Managed Redis
  - name: docusense-redis
    region: oregon
    plan: standard
    maxmemoryPolicy: allkeys-lru
